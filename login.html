<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DejaView - Staff Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <h1>DejaView</h1>
        <h2>Instructor &amp; Admin Portal</h2>
        <p class="login-subtitle">Students register and log in through the VR app.</p>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <p id="loginMessage"></p>
        </form>
    </div>
    <script type="module">
        import { auth, $ } from "./firebase.js";
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
        onAuthStateChanged(auth, u => { if (u) location.href = "index.html"; });
        $("loginForm").addEventListener("submit", async e => {
            e.preventDefault();
            $("loginMessage").textContent = "Logging in...";
            try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
            catch (err) { console.error(err); $("loginMessage").textContent = "Invalid email or password."; }
        });
    </script>
</body>
</html>
